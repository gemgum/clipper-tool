# Membangun pemasang aplikasi desktop.
#
# Ada di sini, bukan di mesin sendiri, karena pemasang Windows (.msi) hanya bisa
# dibuat DI Windows — WiX dan penandatanganan tidak ada di sistem lain. Dengan
# alur ini, pemilik proyek tidak perlu memasang Visual Studio Build Tools 3 GB
# untuk sekadar menghasilkan satu berkas .msi.
#
# Dijalankan dengan tangan (workflow_dispatch) atau saat sebuah tag versi
# didorong — bukan setiap push: satu kali jalan memakan belasan menit di dua
# sistem sekaligus.

name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Pustaka sistem WebKitGTK — hanya perlu di Linux; Windows memakai
      # WebView2 yang sudah ada bawaan.
      - name: Pustaka Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev libssl-dev libayatana-appindicator3-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      # Cache Rust: kompilasi pertama ~400 paket dan itu bagian terlama di
      # seluruh alur ini.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Engine + antarmuka statis harus jadi LEBIH DULU: keduanya ikut dikemas
      # sebagai resource oleh Tauri (lihat desktop/src-tauri/tauri.conf.json).
      - name: Engine (Go)
        working-directory: engine
        run: go build -o ../bin/clipper${{ matrix.name == 'windows' && '.exe' || '' }} ./cmd/clipper

      - name: Antarmuka (statis)
        working-directory: gui
        run: |
          npm ci
          npm run build

      - name: Pemasang (Tauri)
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: clipper-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
